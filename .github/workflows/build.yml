name: Build Dash Launcher

on:
  push:
    paths:
      - launcher.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repo files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create signing key (first run only)
        run: |
          if [ ! -f signing/dashlauncher.jks ]; then
            mkdir -p signing
            keytool -genkeypair -keystore signing/dashlauncher.jks -alias dashlauncher \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass dashlauncher -keypass dashlauncher \
              -dname "CN=Dash Launcher, O=Personal"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add signing/dashlauncher.jks
            git commit -m "Add app signing key"
            git push
          fi

      - name: Unpack project
        run: |
          rm -rf project
          mkdir project
          unzip -q launcher.zip -d project

      - name: Build APK
        working-directory: project
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/signing/dashlauncher.jks
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp project/app/build/outputs/apk/release/app-release.apk DashLauncher.apk
          gh release create "v${{ github.run_number }}" DashLauncher.apk \
            --title "Dash Launcher build ${{ github.run_number }}" \
            --notes "Download DashLauncher.apk on the Carlinkit and install it."
